[project]
name = "mobile_world"
version = "0.0.0"
description = "Mobile World FastAPI application with MongoDB"

readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "beanie>=1.20.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "motor>=3.3.0",
    "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mobile_world*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
