# Нагенерировал NodePort'ов для всех подов Mongo-кластера. Попытаемся вывести наружу вообще все поды,
# чтобы отлаживаться было поудобнее...

#30000: mongos-0
#30001: mongos-1

#30002: configsvr-0
#30003: configsvr-1
#30004: configsvr-2
#30005: shard0-data-0
#30006: shard0-data-1
#30007: shard1-data-0
#30008: shard1-data-1
#30009: shard2-data-0
#30010: shard2-data-1

# Mongos services
apiVersion: v1
kind: Service
metadata:
  name: mongos-0-nodeport
  namespace: mongo
spec:
  type: NodePort
  ports:
  - port: 27017
    targetPort: 27017
    nodePort: 30000
  selector:
    app.kubernetes.io/name: mongodb-sharded
    app.kubernetes.io/component: mongos
    statefulset.kubernetes.io/pod-name: my-mongo-mongodb-sharded-mongos-0
---
apiVersion: v1
kind: Service
metadata:
  name: mongos-1-nodeport
