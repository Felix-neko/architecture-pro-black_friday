# NodePort сервисы для прямого доступа к каждой Redis ноде
---
apiVersion: v1
kind: Service
metadata:
  name: redis-leader-0-nodeport
  namespace: redis
  labels:
    app: redis-nodeport
    node: leader-0
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: my-redis-leader-0
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    nodePort: 30301
    protocol: TCP

