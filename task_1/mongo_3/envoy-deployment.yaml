apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-redis-proxy
  namespace: ot-operators
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envoy-redis-proxy
  template:
    metadata:
      labels:
        app: envoy-redis-proxy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.31-latest
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 9901
          name: admin
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command:
        - /usr/local/bin/envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --service-cluster
        - redis-proxy
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: envoy-redis-proxy
  namespace: ot-operators
spec:
  type: LoadBalancer
  selector:
    app: envoy-redis-proxy
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: admin
    port: 9901
    targetPort: 9901