# Redis Cluster configuration для minikube
# 5 шардов с коэффициентом репликации 2 (1 мастер + 1 реплика)

  # Количество узлов в кластере (должно быть кратно (replicaCount + 1))
  # 5 шардов × 2 узла (мастер + реплика) = 10 узлов
cluster:
  init: true
  nodes: 6
  replicas: 1

  externalAccess:
    enabled: true
    service:
      type: NodePort
      nodePorts: [ 30001, 30002, 30003, 30004, 30005, 30006 ]
    hostnames: [ "192.168.49.2", "192.168.49.2", "192.168.49.2", "192.168.49.2", "192.168.49.2", "192.168.49.2" ]


password: "redis-dev-password"

redis:
  resourcesPreset: micro

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

pdb:
  enabled: true
  minAvailable: 50%

# Tolerations и node affinity (для minikube не нужны)
#tolerations: []
#nodeSelector: {}
#affinity: {}

# Backup configuration (для dev среды)
#backup:
#  enabled: false


## Дополнительные лейблы
#commonLabels:
#  app.kubernetes.io/component: redis-cluster
#  environment: development
#
## Дополнительные аннотации
#commonAnnotations:
#  description: "Redis Cluster для разработки"
#
## Sidecars и init containers
#sidecars: []
#initContainers: []
