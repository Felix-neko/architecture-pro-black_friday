apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: haproxy-redis
  labels:
    app: haproxy-redis
spec:
  serviceName: haproxy-redis
  replicas: 2
  selector:
    matchLabels:
      app: haproxy-redis
  template:
    metadata:
      labels:
        app: haproxy-redis
    spec:
      initContainers:
      - name: wait-for-redis
        image: bitnami/kubectl:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for Redis leader pods to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=my-redis,role=leader -n redis --timeout=300s
            echo "Redis leader pods are ready!"
            
            echo "Waiting for Redis follower pods to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=my-redis,role=follower -n redis --timeout=300s
            echo "Redis follower pods are ready!"
            
            echo "All Redis pods are ready!"
      containers:
      - name: haproxy
        image: haproxy:2.8-alpine
        ports:
        - containerPort: 6379
          name: redis-write
        - containerPort: 6380
          name: redis-read
        - containerPort: 8080
          name: stats
        volumeMounts:
        - name: haproxy-config
          mountPath: /usr/local/etc/haproxy
        livenessProbe:
          httpGet:
            path: /stats
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: haproxy-config
        configMap:
          name: haproxy-redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-redis
  labels:
    app: haproxy-redis
spec:
  type: NodePort
  selector:
    app: haproxy-redis
  ports:
  - name: redis-write
    port: 6379
    targetPort: 6379
    nodePort: 30201
    protocol: TCP
  - name: redis-read
    port: 6380
    targetPort: 6380
    nodePort: 30202
    protocol: TCP
  - name: stats
    port: 8080
    targetPort: 8080
    nodePort: 30200
    protocol: TCP