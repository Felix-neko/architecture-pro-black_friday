apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-redis-config
  namespace: ot-operators
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: redis_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 6379
        filter_chains:
        - filters:
          - name: envoy.filters.network.redis_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
              stat_prefix: redis_stats
              settings:
                op_timeout: 5s
                enable_redirection: true
                enable_command_stats: true
              prefix_routes:
                routes:
                - prefix: "/"
                  cluster: redis_cluster
      
      clusters:
      - name: redis_cluster
        connect_timeout: 1s
        type: strict_dns
        lb_policy: MAGLEV
        load_assignment:
          cluster_name: redis_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: redis-cluster-leader-0.redis-cluster-leader-headless.ot-operators.svc.cluster.local
                    port_value: 6379
            - endpoint:
                address:
                  socket_address:
                    address: redis-cluster-leader-1.redis-cluster-leader-headless.ot-operators.svc.cluster.local
                    port_value: 6379
            - endpoint:
                address:
                  socket_address:
                    address: redis-cluster-leader-2.redis-cluster-leader-headless.ot-operators.svc.cluster.local
                    port_value: 6379
        health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 2
          tcp_health_check: {}

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901