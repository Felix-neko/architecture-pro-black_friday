version: '3.8'

services:
  # Config Server
  configsvr:
    image: mongo:latest
    container_name: configsvr
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - ./mongo_data/configsvr:/data/db
    networks:
      - mongodb-network
    command: mongod --configsvr --replSet configrs --port 27017 --dbpath /data/db --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
    # Config server должен работать в режиме replica set (требование MongoDB)
    # Пока запустим затычку с одной репликой, т.н. single-node replica set

  # Shard 1
  shard1:
    image: mongo:latest
    container_name: shard1
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - ./mongo_data/shard1:/data/db
    networks:
      - mongodb-network
    command: mongod --shardsvr --replSet shard1rs --port 27017 --dbpath /data/db --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  # Shard 2
  shard2:
    image: mongo:latest
    container_name: shard2
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - ./mongo_data/shard2:/data/db
    networks:
      - mongodb-network
    command: mongod --shardsvr --replSet shard2rs --port 27017 --dbpath /data/db --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  # Shard 3
  shard3:
    image: mongo:latest
    container_name: shard3
    restart: unless-stopped
    ports:
      - "27021:27017"
    volumes:
      - ./mongo_data/shard3:/data/db
    networks:
      - mongodb-network
    command: mongod --shardsvr --replSet shard3rs --port 27017 --dbpath /data/db --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  # Инициализация replica sets
  shards-setup:
    image: mongo:latest
    container_name: shards-setup
    networks:
      - mongodb-network
    depends_on:
      configsvr:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
      shard3:
        condition: service_healthy
    volumes:
      - ./init-sharding.js:/init-sharding.js
      - ./scripts/init-replica-sets.sh:/scripts/init-replica-sets.sh
    command: bash /scripts/init-replica-sets.sh
    restart: "no"

  # Mongos Router
  mongos:
    image: mongo:latest
    container_name: mongos
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - mongodb-network
    depends_on:
      shards-setup:
        condition: service_completed_successfully
    command: mongos --configdb configrs/configsvr:27017 --port 27017 --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s

  # Настраиваем роутер
  mongos-setup:
    image: mongo:latest
    container_name: mongos-setup
    networks:
      - mongodb-network
    depends_on:
      mongos:
        condition: service_healthy
    volumes:
      - ./scripts/setup-mongos.sh:/scripts/setup-mongos.sh
    command: bash /scripts/setup-mongos.sh
    restart: "no"

  # Основное веб-приложение для тестирования
  pymongo_api:
    container_name: pymongo_api
    build:
      context: ../../api_app
      dockerfile: Dockerfile
    depends_on:
      mongos-setup:
        condition: service_completed_successfully
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "test_db"
    networks:
      - mongodb-network

  # Mongo Express for web interface
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      mongos:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
      ME_CONFIG_MONGODB_SERVER: mongos
      ME_CONFIG_MONGODB_PORT: 27017
    networks:
      - mongodb-network

  mongoku:
    image: huggingface/mongoku
    container_name: mongoku
    ports:
      - "8082:3100"
    environment:
      - NODE_ENV=production
      - MONGOKU_DEFAULT_SERVER=mongodb://mongos:27017
    depends_on:
      mongos:
        condition: service_healthy
    networks:
      - mongodb-network

networks:
  mongodb-network:
    driver: bridge
