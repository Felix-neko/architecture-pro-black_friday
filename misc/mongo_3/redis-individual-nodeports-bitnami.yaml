---
# NodePort service for Redis cluster pod 0
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-0-nodeport
  namespace: redis
spec:
  type: NodePort
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30200
    protocol: TCP
    name: redis
  selector:
    statefulset.kubernetes.io/pod-name: my-redis-redis-cluster-0

