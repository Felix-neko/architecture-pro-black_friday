apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      containers:
      - name: apisix
        image: apache/apisix:3.2.0-debian
        ports:
        - containerPort: 9080
        - containerPort: 9180
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
        env:
        - name: APISIX_STAND_ALONE
          value: "false"
        readinessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: apisix-config
        configMap:
          name: apisix-config
