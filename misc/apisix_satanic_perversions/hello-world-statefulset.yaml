apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-world
spec:
  serviceName: hello-world
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: html-content
          mountPath: /usr/share/nginx/html-template
        - name: generated-html
          mountPath: /usr/share/nginx/html
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command: ["/bin/sh"]
        args:
        - -c
        - |
          # Generate HTML with pod information
          sed "s/{{POD_NAME}}/$POD_NAME/g; s/{{POD_IP}}/$POD_IP/g" /usr/share/nginx/html-template/index.html > /usr/share/nginx/html/index.html
          # Start nginx
          exec nginx -g 'daemon off;'
      volumes:
      - name: nginx-config
        configMap:
          name: hello-world-nginx-config
      - name: html-content
        configMap:
          name: hello-world-html
      - name: generated-html
        emptyDir: {}
