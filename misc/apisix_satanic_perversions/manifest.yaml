# consul.yaml - Consul для service discovery
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  labels:
    app: consul
spec:
  ports:
    - port: 8500
      name: http
    - port: 8300
      name: server
  clusterIP: None
  selector:
    app: consul
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
spec:
  serviceName: consul
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
      - name: consul
        image: consul:1.19
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8300
          name: server
        env:
        - name: CONSUL_BIND_INTERFACE
          value: eth0
        - name: CONSUL_CLIENT_INTERFACE
          value: eth0
        args:
        - "agent"
        - "-server"
        - "-bootstrap"
        - "-ui"
        - "-client=0.0.0.0"
        - "-bind=0.0.0.0"
        - "-data-dir=/consul/data"
        volumeMounts:
        - name: consul-data
          mountPath: /consul/data
  volumeClaimTemplates:
  - metadata:
      name: consul-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---
# apisix-config.yaml - Конфигурация APISIX
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      admin_listen:
        ip: 0.0.0.0
        port: 9180
      enable_admin: true
      admin_key:
        - name: "admin"
          key: edd1c9f034335f136f87ad84b625c8f1
          role: admin
    
    deployment:
      admin:
        admin_key:
          - name: "admin"
            key: edd1c9f034335f136f87ad84b625c8f1
            role: admin
        enable_admin_cors: true
        admin_listen:
          ip: 0.0.0.0
          port: 9180
      etcd:
        host:
          - "http://etcd:2379"
      config_center: etcd

---
# etcd.yaml - etcd для APISIX
apiVersion: v1
kind: Service
metadata:
  name: etcd
spec:
  ports:
  - port: 2379
    name: client
  - port: 2380
    name: peer
  clusterIP: None
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.9
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        env:
        - name: ETCD_DATA_DIR
          value: /etcd-data
        - name: ETCD_LISTEN_CLIENT_URLS
          value: http://0.0.0.0:2379
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: http://etcd:2379
        - name: ETCD_LISTEN_PEER_URLS
          value: http://0.0.0.0:2380
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: http://etcd:2380
        - name: ETCD_INITIAL_CLUSTER
          value: etcd=http://etcd:2380
        - name: ETCD_NAME
          value: etcd
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd-data
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---
# apisix.yaml - APISIX API Gateway
apiVersion: v1
kind: Service
metadata:
  name: apisix
spec:
  selector:
    app: apisix
  ports:
  - name: http
    port: 9080
    targetPort: 9080
    nodePort: 30080
  - name: admin
    port: 9180
    targetPort: 9180
    nodePort: 30180
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      containers:
      - name: apisix
        image: apache/apisix:3.2.0-debian
        ports:
        - containerPort: 9080
        - containerPort: 9180
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
        env:
        - name: APISIX_STAND_ALONE
          value: "false"
        readinessProbe:
          httpGet:
            path: /apisix/admin/routes
            port: 9180
            httpHeaders:
            - name: X-API-KEY
              value: edd1c9f034335f136f87ad84b625c8f1
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /apisix/admin/routes
            port: 9180
            httpHeaders:
            - name: X-API-KEY
              value: edd1c9f034335f136f87ad84b625c8f1
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: apisix-config
        configMap:
          name: apisix-config

---
# hello-world.yaml - Масштабируемый hello world сервис
apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: hello-world
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-world
spec:
  serviceName: hello-world
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: html-content
          mountPath: /usr/share/nginx/html
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      volumes:
      - name: nginx-config
        configMap:
          name: hello-world-nginx-config
      - name: html-content
        configMap:
          name: hello-world-html

---
# ConfigMap для nginx конфигурацииg
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 8080;
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }

---
# ConfigMap для HTML контента
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Hello World Service</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            .container { max-width: 600px; margin: 0 auto; }
            .info { background: #f0f0f0; padding: 20px; border-radius: 5px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 Hello World Service</h1>
            <div class="info">
                <p><strong>Service:</strong> StatefulSet Hello World</p>
                <p><strong>Time:</strong> <span id="time"></span></p>
                <p><strong>Status:</strong> ✅ Running</p>
                <p><strong>Version:</strong> 1.0.0</p>
            </div>
            <p>This service is running in a Kubernetes StatefulSet and accessible through APISIX API Gateway.</p>
        </div>
        <script>
            function updateTime() {
                document.getElementById('time').textContent = new Date().toISOString();
            }
            updateTime();
            setInterval(updateTime, 1000);
        </script>
    </body>
    </html>